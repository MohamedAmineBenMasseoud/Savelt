<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f9f8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SaveIt">
  <meta name="description" content="Weekly budget and savings tracker for personal spending and your saving goals.">
  <title>SaveIt</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/SaveIt_icons/iOS/AppStore-1024.png" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/SaveIt_icons/iOS/AppStore-1024.png" sizes="1024x1024">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="logo" src="icons/SaveIt_icons/iOS/AppStore-1024.png" alt="SaveIt logo">
        <div><h1>SaveIt</h1><p>My personal weekly budget</p></div>
      </div>
      <button class="btn" data-action="add-week">+ Add Week</button>
    </header>

    <!-- app.js draws the current screen here -->
    <main id="view"></main>
  </div>

  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-inner">
      <button class="tab active" data-page="dashboard">
        <img class="tab-icon" src="icons/SaveIt_icons/dashboard.png" alt="Dashboard">
        Dashboard
      </button>
      <button class="tab" data-page="history">
        <img class="tab-icon" src="icons/SaveIt_icons/history.png" alt="History">
        History
      </button>
      <button class="tab" data-page="savings">
        <img class="tab-icon" src="icons/SaveIt_icons/savings.png" alt="Savings">
        Savings
      </button>
    </div>
  </nav>

  <noscript>SaveIt needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
